name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks
        env:
          DJANGO_SECRET_KEY: test-secret
          DJANGO_DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python manage.py check

      - name: Run migrations
        env:
          DJANGO_SECRET_KEY: test-secret
          DJANGO_DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python manage.py migrate

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: test-secret
          DJANGO_DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python manage.py test

  build-and-push:
    if: github.event_name == 'push'
    needs: test
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/krishnadhakal03/bhrikutimandap:latest
            ghcr.io/krishnadhakal03/bhrikutimandap:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          KEY_PATH="$GITHUB_WORKSPACE/.deploy_ssh_key"

          if [ -n "${VPS_SSH_KEY_B64:-}" ]; then
            echo "Using VPS_SSH_KEY_B64 (chars: ${#VPS_SSH_KEY_B64})"
          else
            echo "Using VPS_SSH_KEY (chars: ${#VPS_SSH_KEY})"
          fi

          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "ERROR: GitHub Secret VPS_SSH_KEY is empty or missing." >&2
            exit 1
          fi

          # Write key to file.
          # Prefer base64 form (avoids newline/formatting issues in GitHub Secrets) if provided.
          if [ -n "${VPS_SSH_KEY_B64:-}" ]; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > "$KEY_PATH"
          else
            if [ -z "${VPS_SSH_KEY:-}" ]; then
              echo "ERROR: GitHub Secret VPS_SSH_KEY is empty or missing." >&2
              exit 1
            fi
            # If the secret contains literal \n, convert them to real newlines.
            printf '%s' "$VPS_SSH_KEY" | sed 's/\\n/\n/g' > "$KEY_PATH"
          fi

          # Normalize Windows CRLF and ensure trailing newline.
          # (Does not change key material, just line endings.)
          tr -d '\r' < "$KEY_PATH" > "$KEY_PATH.tmp"
          mv "$KEY_PATH.tmp" "$KEY_PATH"
          printf '\n' >> "$KEY_PATH"
          # Note: appleboy/ssh-action runs inside a Docker container; the mounted workspace file
          # must be readable by the container user. Keep it non-writable and avoid printing it.
          chmod 644 "$KEY_PATH"

          echo "SSH key diagnostics (safe):"
          echo "- bytes: $(wc -c < "$KEY_PATH" | tr -d ' ' )"
          echo "- lines: $(wc -l < "$KEY_PATH" | tr -d ' ' )"
          echo "- first: $(head -n 1 "$KEY_PATH" || true)"
          echo "- last:  $(grep -v '^$' "$KEY_PATH" | tail -n 1 || true)"

          # Validate key without prompting (ssh-keygen -y cannot take a passphrase non-interactively).
          # We do a lightweight integrity check: must contain BEGIN/END markers.
          if ! grep -q '^-----BEGIN OPENSSH PRIVATE KEY-----$' "$KEY_PATH"; then
            echo "ERROR: Decoded key is missing the OPENSSH BEGIN marker. Ensure VPS_SSH_KEY_B64 encodes the PRIVATE KEY FILE bytes (not the public key)." >&2
            exit 1
          fi
          if ! grep -q '^-----END OPENSSH PRIVATE KEY-----$' "$KEY_PATH"; then
            echo "ERROR: Decoded key is missing the OPENSSH END marker. The secret is likely truncated." >&2
            exit 1
          fi

      - name: SSH auth smoke test
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # OpenSSH is strict about private key file permissions; use a temp 0600 copy.
          cp ./.deploy_ssh_key /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          echo "Testing SSH auth to VPS (no commands executed beyond 'echo ok')..."
          # Print verbose auth diagnostics (host/user are masked by GitHub secrets).
          ssh -vvv \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i /tmp/deploy_key \
            "${VPS_USER}@${VPS_HOST}" \
            "echo ok"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ./.deploy_ssh_key
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          debug: true
          script: |
            set -euo pipefail
            APP_DIR="/opt/bhrikutimandap"

            echo "== Server diagnostics =="
            whoami
            uname -a || true
            git --version || true
            docker --version || true
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "ERROR: Docker Compose not found (docker compose / docker-compose)." >&2
              exit 1
            fi
            echo "Compose command: $COMPOSE"

            if [ ! -d "$APP_DIR" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $USER:$USER "$APP_DIR"
              git clone https://github.com/krishnadhakal03/bhrikutimandap.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            echo "== Sync repo =="
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            git rev-parse --short HEAD

            # Ensure .env.prod exists
            if [ ! -f .env.prod ]; then
              echo "ERROR: $APP_DIR/.env.prod missing. Create it from .env.prod.example" >&2
              exit 1
            fi

            # Build the image on the VPS (avoids needing registry credentials)
            docker build -t bhrikutimandap:deploy .
            export APP_IMAGE="bhrikutimandap:deploy"

            $COMPOSE --env-file .env.prod -f compose.prod.yml up -d
            $COMPOSE --env-file .env.prod -f compose.prod.yml ps

            $COMPOSE --env-file .env.prod -f compose.prod.yml exec -T web python manage.py migrate
            $COMPOSE --env-file .env.prod -f compose.prod.yml exec -T web python manage.py seed_email_templates
            $COMPOSE --env-file .env.prod -f compose.prod.yml exec -T web python manage.py collectstatic --noinput

            # Cache busting: increment version on each deployment
            # This forces browsers to fetch fresh static files
            CURRENT_VERSION=$(grep "^STATIC_VERSION=" .env.prod 2>/dev/null || echo "STATIC_VERSION=1.0")
            TIMESTAMP=$(date +%s)
            echo "STATIC_VERSION=1.$(($TIMESTAMP))" >> .env.prod
            echo "Cache busting version updated: 1.$TIMESTAMP"

            # Basic health check
            echo "== Health check =="
            for i in $(seq 1 30); do
              if curl -fsS -H "Host: bhrikutimandap.com" -H "X-Forwarded-Proto: https" http://127.0.0.1:8000/ >/dev/null; then
                echo "Health check OK"
                break
              fi
              echo "Health check retry $i/30 ..."
              sleep 2
              if [ "$i" -eq 30 ]; then
                echo "ERROR: Health check failed" >&2
                $COMPOSE --env-file .env.prod -f compose.prod.yml logs --tail=200 web || true
                exit 1
              fi
            done
            echo "Deploy OK"
