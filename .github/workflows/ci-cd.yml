name: CI/CD

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks
        env:
          DJANGO_SECRET_KEY: test-secret
          DJANGO_DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python manage.py check

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: test-secret
          DJANGO_DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python manage.py test

  build-and-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/krishnadhakal03/bhrikutimandap:latest
            ghcr.io/krishnadhakal03/bhrikutimandap:${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="/opt/bhrikutimandap"
            if [ ! -d "$APP_DIR" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $USER:$USER "$APP_DIR"
              git clone https://github.com/krishnadhakal03/bhrikutimandap.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git pull origin main

            # Ensure .env.prod exists
            if [ ! -f .env.prod ]; then
              echo "ERROR: $APP_DIR/.env.prod missing. Create it from .env.prod.example" >&2
              exit 1
            fi

            # Pull and run the specific image for this commit
            export APP_IMAGE="ghcr.io/krishnadhakal03/bhrikutimandap:${{ github.sha }}"

            docker login ghcr.io -u krishnadhakal03 -p "${{ secrets.GHCR_READ_TOKEN }}" || true

            docker compose --env-file .env.prod -f compose.prod.yml pull
            docker compose --env-file .env.prod -f compose.prod.yml up -d

            docker compose --env-file .env.prod -f compose.prod.yml exec -T web python manage.py migrate
            docker compose --env-file .env.prod -f compose.prod.yml exec -T web python manage.py collectstatic --noinput

            # Basic health check
            curl -fsS -H "Host: bhrikutimandap.com" -H "X-Forwarded-Proto: https" http://127.0.0.1:8000/ >/dev/null
            echo "Deploy OK"
