<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #2c3e50; }
      .step { font: bold 16px sans-serif; fill: #fff; }
      .desc { font: 12px sans-serif; fill: #555; }
      .box { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .doc { fill: #2ecc71; stroke: #27ae60; stroke-width: 2; }
      .config { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>
  
  <text x="400" y="30" text-anchor="middle" class="title">Bhrikutimandap Deployment Process</text>
  
  <!-- Step 1: Read Documentation -->
  <rect x="50" y="60" width="700" height="80" rx="5" class="doc"/>
  <text x="400" y="90" text-anchor="middle" class="step">1. Read Documentation</text>
  <text x="400" y="110" text-anchor="middle" class="desc">Start with QUICK_DEPLOYMENT.md (30 min guide)</text>
  <text x="400" y="125" text-anchor="middle" class="desc">Reference DEPLOYMENT.md for details</text>
  
  <!-- Arrow -->
  <line x1="400" y1="140" x2="400" y2="170" class="arrow"/>
  
  <!-- Step 2: Prepare Locally -->
  <rect x="50" y="170" width="700" height="80" rx="5" class="box"/>
  <text x="400" y="200" text-anchor="middle" class="step">2. Prepare Locally</text>
  <text x="400" y="220" text-anchor="middle" class="desc">Copy .env.example to .env</text>
  <text x="400" y="235" text-anchor="middle" class="desc">Generate SECRET_KEY and configure environment</text>
  
  <!-- Arrow -->
  <line x1="400" y1="250" x2="400" y2="280" class="arrow"/>
  
  <!-- Step 3: Hostinger Setup -->
  <rect x="50" y="280" width="700" height="80" rx="5" class="box"/>
  <text x="400" y="310" text-anchor="middle" class="step">3. Hostinger Setup</text>
  <text x="400" y="330" text-anchor="middle" class="desc">Create MySQL database in hPanel</text>
  <text x="400" y="345" text-anchor="middle" class="desc">Note credentials and update .env</text>
  
  <!-- Arrow -->
  <line x1="400" y1="360" x2="400" y2="390" class="arrow"/>
  
  <!-- Step 4: Upload Files -->
  <rect x="50" y="390" width="700" height="80" rx="5" class="box"/>
  <text x="400" y="420" text-anchor="middle" class="step">4. Upload Files</text>
  <text x="400" y="440" text-anchor="middle" class="desc">SSH + Git (recommended) or FTP</text>
  <text x="400" y="455" text-anchor="middle" class="desc">Upload to ~/public_html/bhrikutimandap/</text>
  
  <!-- Arrow -->
  <line x1="400" y1="470" x2="400" y2="500" class="arrow"/>
  
  <!-- Step 5: Configure -->
  <rect x="50" y="500" width="700" height="80" rx="5" class="config"/>
  <text x="400" y="530" text-anchor="middle" class="step">5. Configure Files</text>
  <text x="400" y="550" text-anchor="middle" class="desc">Update username in passenger_wsgi.py and .htaccess</text>
  <text x="400" y="565" text-anchor="middle" class="desc">Verify .env settings</text>
  
  <!-- Arrow -->
  <line x1="400" y1="580" x2="400" y2="610" class="arrow"/>
  
  <!-- Step 6: Python Environment -->
  <rect x="50" y="610" width="700" height="80" rx="5" class="box"/>
  <text x="400" y="640" text-anchor="middle" class="step">6. Python Environment</text>
  <text x="400" y="660" text-anchor="middle" class="desc">Create venv and install requirements.txt</text>
  <text x="400" y="675" text-anchor="middle" class="desc">python3 -m venv venv && pip install -r requirements.txt</text>
  
  <!-- Arrow -->
  <line x1="400" y1="690" x2="400" y2="720" class="arrow"/>
  
  <!-- Step 7: Django Setup -->
  <rect x="50" y="720" width="700" height="100" rx="5" class="box"/>
  <text x="400" y="750" text-anchor="middle" class="step">7. Django Setup</text>
  <text x="400" y="770" text-anchor="middle" class="desc">migrate → createsuperuser → collectstatic</text>
  <text x="400" y="785" text-anchor="middle" class="desc">Use --settings=market.production_settings</text>
  <text x="400" y="800" text-anchor="middle" class="desc">Optional: python manage.py seed</text>
  
  <!-- Arrow -->
  <line x1="400" y1="820" x2="400" y2="850" class="arrow"/>
  
  <!-- Step 8: Permissions & Launch -->
  <rect x="50" y="850" width="700" height="80" rx="5" class="box"/>
  <text x="400" y="880" text-anchor="middle" class="step">8. Set Permissions &amp; Launch</text>
  <text x="400" y="900" text-anchor="middle" class="desc">chmod -R 755, chmod 600 .env</text>
  <text x="400" y="915" text-anchor="middle" class="desc">touch tmp/restart.txt</text>
  
  <!-- Arrow -->
  <line x1="400" y1="930" x2="400" y2="960" class="arrow"/>
  
  <!-- Step 9: Test -->
  <rect x="50" y="960" width="700" height="80" rx="5" class="doc"/>
  <text x="400" y="990" text-anchor="middle" class="step">9. Test Your Site</text>
  <text x="400" y="1010" text-anchor="middle" class="desc">Visit homepage, admin panel, agent dashboard</text>
  <text x="400" y="1025" text-anchor="middle" class="desc">Verify SSL, static files, and functionality</text>
  
  <!-- Arrow -->
  <line x1="400" y1="1040" x2="400" y2="1070" class="arrow"/>
  
  <!-- Step 10: Success -->
  <rect x="50" y="1070" width="700" height="80" rx="5" class="doc"/>
  <text x="400" y="1100" text-anchor="middle" class="step">🎉 Deployment Complete!</text>
  <text x="400" y="1120" text-anchor="middle" class="desc">Configure backups, monitoring, and SSL</text>
  <text x="400" y="1135" text-anchor="middle" class="desc">Use DEPLOYMENT_CHECKLIST.md to verify</text>
  
  <!-- Legend -->
  <text x="50" y="1180" class="desc" style="font-weight: bold;">Legend:</text>
  <rect x="150" y="1165" width="20" height="20" class="doc"/>
  <text x="175" y="1180" class="desc">Documentation</text>
  <rect x="280" y="1165" width="20" height="20" class="box"/>
  <text x="305" y="1180" class="desc">Action Step</text>
  <rect x="410" y="1165" width="20" height="20" class="config"/>
  <text x="435" y="1180" class="desc">Configuration</text>
</svg>
