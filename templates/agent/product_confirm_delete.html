{% extends "agent/base.html" %}

{% block agent_content %}
<div class="agent-toolbar">
    <div>
        <h3><i class="fas fa-trash-alt"></i> Delete Product</h3>
        <p class="subtitle">This action is permanent and cannot be undone.</p>
    </div>
    <a href="{% url 'agent:products_list' %}" class="btn btn-secondary btn-sm">Back to Products</a>
</div>

<div class="card border-danger">
    <div class="card-body text-center">
        <i class="fas fa-exclamation-triangle text-danger" style="font-size: 48px;"></i>
        <h5 class="mt-3">Are you sure?</h5>
        <p class="text-muted">
            You are about to permanently delete <strong>{{ product.title }}</strong> and its associated records.
        </p>
        
        <div class="mt-4">
            <form method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-trash mr-2"></i> Yes, Delete Product
                </button>
            </form>
            <a href="{% url 'agent:products_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
