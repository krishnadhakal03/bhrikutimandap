{% extends "agent/base.html" %}

{% block agent_content %}
<div class="mb-4">
    <h3 class="text-dark">Delete Product</h3>
</div>

<div class="card border-danger">
    <div class="card-body text-center">
        <i class="fas fa-exclamation-triangle text-danger" style="font-size: 48px;"></i>
        <h5 class="mt-3">Are you sure?</h5>
        <p class="text-muted">
            This action will permanently delete <strong>{{ product.title }}</strong> and all its associated data.
        </p>
        
        <div class="mt-4">
            <form method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-trash mr-2"></i> Yes, Delete
                </button>
            </form>
            <a href="{% url 'agent:products_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
